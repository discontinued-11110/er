<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👁️‍🗨️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: monospace;
      background: black;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo con imagen */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('https://i.pinimg.com/736x/81/5d/a3/815da329e39418d9b17cc1f5717edbe0.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.5); /* oscurece la imagen para contraste */
      z-index: -1;
    }

    .timer-container {
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 10px;
    }

    .timer-display {
      font-size: 2.5rem;
      font-family: monospace;
      font-weight: normal;
      color: white;
      position: relative;
      animation: subtle-glitch-effect 8s infinite;
      word-wrap: break-word;
    }

    .timer-display::before {
      content: attr(data-text);
      position: absolute;
      left: 2px;
      top: 0;
      color: rgba(255, 255, 255, 0.1);
      animation: glitch-1 0.6s infinite;
      opacity: 0;
    }

    .timer-display::after {
      content: attr(data-text);
      position: absolute;
      left: -2px;
      top: 0;
      color: rgba(255, 255, 255, 0.1);
      animation: glitch-2 0.6s infinite;
      opacity: 0;
    }

    @keyframes subtle-glitch-effect {
      0%, 90%, 100% { transform: translateX(0); }
      92% { transform: translateX(-1px); }
      94% { transform: translateX(1px); }
      96% { transform: translateX(0); }
    }

    @keyframes glitch-1 {
      0%, 90%, 100% { opacity: 0; }
      92% { opacity: 0.3; }
    }

    @keyframes glitch-2 {
      0%, 90%, 100% { opacity: 0; }
      94% { opacity: 0.2; }
    }

    .config-comment {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.3);
      max-width: 300px;
      line-height: 1.2;
      font-family: monospace;
      z-index: 1;
    }

    /* Responsividad */
    @media (max-width: 768px) {
      .timer-display {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .timer-display {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="timer-container">
    <div id="timer" class="timer-display" data-text="00:00:00:00">00:00:00:00</div>
  </div>

  <script>
    const TARGET_DATE = '2025-12-01 00:00:00'; // 1 de diciembre 2025

    class UniversalTimer {
      constructor() {
        this.timerElement = document.getElementById('timer');
        this.targetDate = new Date(TARGET_DATE).getTime();

        if (isNaN(this.targetDate)) {
          console.error('ERROR: Fecha TARGET_DATE inválida:', TARGET_DATE);
          this.timerElement.textContent = "ERROR DE FECHA";
          return;
        }
        if (this.targetDate <= Date.now()) {
          console.warn('ADVERTENCIA: La fecha objetivo ya pasó:', TARGET_DATE);
          this.timerElement.textContent = "FECHA PASADA";
          return;
        }
        this.start();
      }

      getTimeRemaining() {
        const now = Date.now();
        const timeDiff = this.targetDate - now;

        if (timeDiff <= 0) {
          return { total: 0, days: 0, hours: 0, minutes: 0, seconds: 0 };
        }

        const totalSeconds = Math.floor(timeDiff / 1000);
        const days = Math.floor(totalSeconds / (24 * 60 * 60));
        const hours = Math.floor((totalSeconds % (24 * 60 * 60)) / (60 * 60));
        const minutes = Math.floor((totalSeconds % (60 * 60)) / 60);
        const seconds = totalSeconds % 60;

        return { total: totalSeconds, days, hours, minutes, seconds };
      }

      formatTime(timeObj) {
        if (timeObj.total <= 0) return "00:00:00:00";
        return `${timeObj.days.toString().padStart(2,'0')}:${timeObj.hours.toString().padStart(2,'0')}:${timeObj.minutes.toString().padStart(2,'0')}:${timeObj.seconds.toString().padStart(2,'0')}`;
      }

      updateDisplay() {
        const timeRemaining = this.getTimeRemaining();
        const formatted = this.formatTime(timeRemaining);
        this.timerElement.textContent = formatted;
        this.timerElement.setAttribute('data-text', formatted);

        if (timeRemaining.total <= 0) {
          clearInterval(this.interval);
          this.timerElement.textContent = "TIEMPO AGOTADO";
          this.timerElement.setAttribute('data-text', "TIEMPO AGOTADO");
        }
      }

      start() {
        this.updateDisplay();
        this.interval = setInterval(() => this.updateDisplay(), 1000);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      window.lainTimer = new UniversalTimer();
    });
  </script>
</body>
</html>
