    <!-- Scripts -->
    <script type="text/javascript">
        // Función para cambiar lista de SoundCloud
        function cambiarLista() {
            const url = document.getElementById('soundcloud-url').value;
            if(url) {
                const iframe = document.getElementById('soundcloud-iframe');
                iframe.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23000000&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false`;
            }
        }

        // Script para controlar el panel de SoundCloud
        var soundcloudPanel = document.getElementById('soundcloud-panel');
        var soundcloudToggleBtn = document.getElementById('soundcloud-toggle-btn');
        var closeSoundcloudBtn = document.getElementById('close-soundcloud');
        
        // Función para mostrar el panel de SoundCloud
        soundcloudToggleBtn.addEventListener('click', function() {
            soundcloudPanel.classList.toggle('open');
        });
        
        // Función para cerrar el panel de SoundCloud
        closeSoundcloudBtn.addEventListener('click', function() {
            soundcloudPanel.classList.remove('open');
        });

        // Array de frases aleatorias
        const frases = [
            "Squirrels secretly rule the world from the park trees.",
            "My socks have secret conversations at night.",
            "Unicorns play chess at the bottom of the ocean.",
            "Bent spoons are portals to parallel dimensions.",
            "Cheese is actually a form of extraterrestrial communication.",
            "Cats are undercover alien spies.",
            "My hat has deeper thoughts than I do.",
            "Clouds conspire to change the shape of mountains.",
            "Books whisper secrets when no one is reading them.",
            "Mirrors are windows to alternate worlds trying to mimic us."
        ];

        // Función para obtener una frase aleatoria
        function obtenerFraseAleatoria() {
            const indiceAleatorio = Math.floor(Math.random() * frases.length);
            return frases[indiceAleatorio];
        }

        // Obtener el elemento span con el ID "textoCambiante"
        const spanTextoCambiante = document.getElementById("textoCambiante");

        // Actualizar el texto con una frase aleatoria al cargar la página
        spanTextoCambiante.textContent = obtenerFraseAleatoria();

        // Actualizar el texto cada vez que se cargue la página o se haga clic en el enlace
        const enlace = document.querySelector('a');
        enlace.addEventListener('click', () => {
            spanTextoCambiante.textContent = obtenerFraseAleatoria();
        });
    </script>
